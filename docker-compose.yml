services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  shake-dev:
    image: nginx:latest
    container_name: shake-dev
    restart: always
    volumes:
      - ./client:/usr/share/nginx/html
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

  shake-server:
    image: xanderstrike/shake-server:latest
    container_name: shake-server
    restart: always

volumes:
  caddy_data:
  caddy_config:
