networks:
  proxy-network:
    external: true

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"      # HTTP → redirects to HTTPS
      - "443:443"    # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy-network
  shake-dev:
    image: nginx:latest
    container_name: shake-dev
    restart: always
    volumes:
      - ./client:/usr/share/nginx/html
      - ./demoq3:/usr/share/nginx/html/demoq3
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
    # No ports exposed to host — Caddy proxies internally
    networks:
      - proxy-network

  shake-server:
    image: xanderstrike/shake-server:latest
    container_name: shake-server
    restart: always
    # No ports exposed to host — Caddy proxies internally
    networks:
      - proxy-network

volumes:
  caddy_data:
  caddy_config:
